<!doctype html>
<!--
  Kanban-tavla for arbeidskøen (se docs/board.md). Serveres av scripts/orkestrator/ko-tavle.mjs, som også lager
  tema.css (den nøytrale paletten i lib/koTavle.js) og setter inn tittelen fra ko.config.json. Vanilla JS i tavle.js,
  ingen byggesteg, ingen CDN. Visningen «Avhengigheter»: graf.js tegner, oppsettet er de rene funksjonene i
  lib/koGraf.js. Toppen: to rader med logoen i venstre hjørne; rad 1 arbeidsrommene Planer og Kø, tittel, status,
  «Venter på deg» og tannhjulet, rad 2 visningsfanene, søk, Filter, Utvalg og gruppering. Planer-rommet
  (planer/planer.js) ligger under toppen. Under den: stripa med «Neste opp» og kjeden rundt det valgte kortet.
  Flervalg med valglinja nederst, «Merk alle treff» ved søket, dialogen for massehandlinger (forhåndsvisning før
  lagring) og «Angre».
-->
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITTEL}}</title>
    <link rel="stylesheet" href="/tema.css" />
    <link rel="stylesheet" href="/tavle.css" />
    <link rel="stylesheet" href="/planer/planer.css" />
    <script src="/uu.js" defer></script>
    <script src="/koGraf.js" defer></script>
    <script src="/graf.js" defer></script>
    <script src="/plan.js" defer></script>
    <!-- Kortbufferen (diffen) og tastaturet mellom kolonnene; samme fil som testene bruker. -->
    <script src="/ytelse.js" defer></script>
    <script src="/tavle.js" defer></script>
    <!-- Planer-rommet. Reglene (koPlanVisning.js) er samme fil som testene bruker; planer.js tegner. Etter
         tavle.js, så nøkkelen fra lenken er lagret før Planer henter registeret. -->
    <script src="/koPlanVisning.js" defer></script>
    <!-- Flaten Dokumenter og avtaler (før planer.js, som tegner den). -->
    <script src="/planer/dokumenter.js" defer></script>
    <!-- Prioritetskartet og fristbåndet (før planer.js, som tegner dem). -->
    <script src="/planer/kart.js" defer></script>
    <!-- Trekartet og avhengighetene for utvalget (før planer.js, som tegner dem). -->
    <script src="/planer/struktur.js" defer></script>
    <!-- Lesevisningen av dokumenter og Uregistrert-boksen (før planer.js, som tegner dem). -->
    <script src="/planer/les.js" defer></script>
    <!-- Flatene Juridisk, Beslutninger og Lansering (før planer.js, som tegner dem). -->
    <script src="/planer/juridisk.js" defer></script>
    <!-- Oversikten, og tastaturet, Ctrl+K, flervalget og endringen i raden (før planer.js). -->
    <script src="/planer/oversikt.js" defer></script>
    <script src="/planer/arbeid.js" defer></script>
    <script src="/planer/planer.js" defer></script>
  </head>
  <body>
    <!--
      Toppen er et grid i to rader med maskoten (logoen) i venstre hjørne over begge. Rad 1: tittel,
      status, «Venter på deg» og tannhjulet (hjelp og tema ligger i innstillingene). Rad 2: visningsfanene, så søk,
      Filter, Utvalg og gruppering. Hvilken side maskoten står på styres av én linje i tavle.css (.topp).
    -->
    <header class="topp">
      <!-- Logoen settes inn av tegnLogo() i tavle.js når /logo finnes; ellers står sonen tom som plassholder. -->
      <div id="maskot" class="maskot tom"></div>
      <!-- Snakkeboblen ved maskoten. Teksten settes alltid med textContent. -->
      <p id="boble" class="boble" role="note" hidden></p>
      <div class="topp-rad topp-rad1">
        <!-- Arbeidsrommene Planer og Kø. Valget står i nettadressen (?rom=planer), og hvert rom
             har sin egen aksentfarge (planer/planer.css). -->
        <div id="rom-valg" class="veksler rom-valg" role="tablist" aria-label="Arbeidsrom">
          <button
            type="button"
            id="rom-planer"
            class="veksler-knapp"
            role="tab"
            aria-controls="planer-rom"
            aria-selected="false"
            tabindex="-1"
            title="Planregisteret: moduler, prosjekter og planposter"
          >
            Planer
          </button>
          <button
            type="button"
            id="rom-ko"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="true"
            tabindex="0"
            title="Arbeidskøen: kortene, fokuset og statistikken"
          >
            Kø
          </button>
        </div>
        <h1 class="tittel">{{TITTEL}}</h1>
        <p id="status" class="status" role="status" aria-live="polite">Henter køen …</p>
        <button
          type="button"
          id="innboks"
          class="knapp knapp-kontur innboks-knapp"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          Venter på deg
        </button>
        <span class="topp-fyll"></span>
        <button
          type="button"
          id="innstillinger"
          class="knapp-ikon"
          aria-label="Innstillinger"
          title="Innstillinger"
        ></button>
      </div>
      <div class="topp-rad topp-rad2">
        <div id="faner" class="veksler" role="tablist" aria-label="Visning">
          <button
            type="button"
            id="vis-flat"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="true"
            tabindex="0"
            title="Kolonnene I kø, Pågår, Review og Bygget"
          >
            Flat
          </button>
          <button
            type="button"
            id="vis-baner"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="false"
            tabindex="-1"
            title="Én rad per prosjekt; dra banene for å endre prosjektenes prioritet"
          >
            Prosjektbaner
          </button>
          <button
            type="button"
            id="vis-plan"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="false"
            tabindex="-1"
            title="Fokuset som Nå, Neste, Senere og Venter: dra områder og prosjekter, og lagre fokus"
          >
            Fokus
          </button>
          <button
            type="button"
            id="vis-graf"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="false"
            tabindex="-1"
            title="Hvilke oppgaver som venter på hvilke"
          >
            Avhengigheter
          </button>
          <button
            type="button"
            id="vis-sky"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="false"
            tabindex="-1"
            title="Oppgaver som kan kjøres i skyen, og skyøktene"
          >
            Sky
          </button>
          <button
            type="button"
            id="vis-statistikk"
            class="veksler-knapp"
            role="tab"
            aria-controls="tavle"
            aria-selected="false"
            tabindex="-1"
            title="Gjennomstrømning, ledetid og forbruk over tid"
          >
            Statistikk
          </button>
        </div>
        <span class="topp-fyll"></span>
        <div id="sok-filter" class="sok-filter">
          <input
            id="sok"
            class="sok"
            type="search"
            placeholder="Søk i id, tittel eller funksjon"
            aria-label="Søk i id, tittel eller funksjon"
            autocomplete="off"
          />
          <div class="filter">
            <button
              type="button"
              id="filter-knapp"
              class="knapp knapp-kontur filter-knapp"
              aria-expanded="false"
              aria-controls="filter-meny"
            >
              Filter
            </button>
            <div id="filter-meny" class="filter-meny" role="group" aria-label="Filter" hidden></div>
          </div>
          <button type="button" id="merk-treff" class="knapp knapp-kontur merk-treff" hidden>
            Merk alle treff
          </button>
          <div class="filter">
            <button
              type="button"
              id="visninger"
              class="knapp knapp-kontur filter-knapp"
              aria-expanded="false"
              aria-controls="visninger-meny"
              title="Innebygde utvalg og dine lagrede utvalg (søk, filter, gruppering og visning)"
            >
              Utvalg
            </button>
            <div
              id="visninger-meny"
              class="filter-meny"
              role="group"
              aria-label="Utvalg"
              hidden
            ></div>
          </div>
        </div>
        <select
          id="gruppering"
          class="gruppering"
          aria-label="Gruppering"
          title="Del kortene i grupper: område og prosjekt, prosjekt og funksjon, eller fokustrinn"
        ></select>
      </div>
    </header>
    <!-- Fokuslinja (trinnene, resten, klare i fokus, varsel når fokus ikke har noe klart). -->
    <div id="fokuslinje" class="fokuslinje" aria-label="Fokus" hidden></div>
    <div id="stripe" class="stripe" aria-label="Neste opp og kjeden" hidden></div>
    <!-- Vises når serveren svarer 401 (startet på nytt); pollingen står til nøkkelen er på plass. -->
    <div id="nokkel-banner" class="nokkel-banner" role="alert" hidden>
      <p class="nokkel-banner-tekst">Tavla er startet på nytt. Lim inn lenken fra terminalen.</p>
      <form id="nokkel-skjema" class="nokkel-skjema">
        <input
          id="nokkel-lenke"
          class="sok"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="http://127.0.0.1:…/#nokkel=…"
          aria-label="Lenken fra terminalen"
        />
        <button type="submit" class="knapp knapp-fylt">Bruk lenken</button>
      </form>
      <p id="nokkel-feil" class="nokkel-feil" hidden></p>
    </div>
    <main id="tavle" class="tavle" role="tabpanel" aria-label="Tavla"></main>
    <!-- Planer-rommet (brødsmulesti og tre ruter), tegnet av planer/planer.js. -->
    <section
      id="planer-rom"
      class="planer-rom"
      role="tabpanel"
      aria-label="Planer"
      hidden
    ></section>
    <div id="panel-bakgrunn" class="panel-bakgrunn" hidden></div>
    <aside
      id="panel"
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="panel-tittel"
      hidden
    ></aside>
    <div id="vakt-bakgrunn" class="vakt-bakgrunn" hidden>
      <div
        id="vakt"
        class="vakt"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="vakt-tittel"
        aria-describedby="vakt-tekst"
      ></div>
    </div>
    <!-- Valglinja (vises når noe er merket), dialogen for en massehandling og «Angre»-meldingen. -->
    <div id="valglinje" class="valglinje" role="region" aria-label="Merkede oppgaver" hidden></div>
    <div id="masse-bakgrunn" class="vakt-bakgrunn" hidden>
      <div
        id="masse"
        class="vakt masse"
        role="dialog"
        aria-modal="true"
        aria-labelledby="masse-tittel"
        aria-describedby="masse-forklaring"
      ></div>
    </div>
    <!-- Én stabel for meldingen og «Angre» (rekkefølgen styres av toast-køen i uu.js). -->
    <div id="toaster" class="toaster">
      <div id="angre-melding" class="angre-melding" role="status" hidden></div>
      <div id="melding" class="melding" role="alert" hidden></div>
    </div>
  </body>
</html>
